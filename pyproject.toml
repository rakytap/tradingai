[project]
name = "tradingai"
version = "0.1.0"
description = "Stock trading assistant MCP server for Cursor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.8,<2",
    "yfinance>=0.2.40",
    "pandas>=2.2.0",
    "pandas-ta>=0.3.14b",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
tradingai-mcp = "tradingai.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradingai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests that require network access",
]
