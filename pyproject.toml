[project]
name = "tradingai"
version = "0.1.0"
description = "Stock trading assistant MCP server for Cursor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.8,<2",
    "yfinance>=0.2.40",
    "pandas>=2.2.0",
    "pandas-ta>=0.3.14b",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "edgartools>=5.0",
    "feedparser>=6.0",
    "httpx>=0.27",
    "praw>=7.7",
    "fredapi>=0.5.1",
    "psycopg[binary]>=3.2",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "xgboost>=2.0",
    "joblib>=1.3",
    "ib_insync>=0.9.86",
    "pyarrow>=15",
    "alpaca-py>=0.28",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
torch = [
    "torch>=2.2",
]

[project.scripts]
tradingai-mcp = "tradingai.server:main"
tradingai-news-mcp = "tradingai.news.server:main"
tradingai-regime-mcp = "tradingai.regime.server:main"
tradingai-predict-mcp = "tradingai.predict.server:main"
tradingai-ibkr-mcp = "tradingai.ibkr.server:main"
tradingai-predict-eval = "tradingai.predict.evaluation.runner:main"
tradingai-tune-fusion = "tradingai.predict.jobs.tune_fusion_weights:main"
tradingai-predict-batch = "tradingai.predict.jobs.generate_predictions:main"
tradingai-paper-portfolio = "tradingai.predict.jobs.build_paper_portfolio:main"
tradingai-paper-portfolio-ibkr-rebalance = "tradingai.predict.jobs.build_paper_portfolio_ibkr_rebalance:main"
tradingai-sync-intraday = "tradingai.intraday.jobs.sync_intraday_bars:main"
tradingai-backfill-intraday = "tradingai.intraday.jobs.backfill_intraday_bars:main"
tradingai-build-dip-dataset = "tradingai.intraday.jobs.build_dip_dataset:main"
tradingai-train-dip-model = "tradingai.intraday.jobs.train_dip_model:main"
tradingai-validate-dip-model = "tradingai.intraday.jobs.validate_dip_model:main"
tradingai-scan-open-dip = "tradingai.intraday.jobs.scan_open_dip:main"
tradingai-sim-download = "tradingai.sim.jobs.download_alpaca_5m:main"
tradingai-sim-run = "tradingai.sim.jobs.run_dip_sim:main"
tradingai-sync-stocks = "tradingai.data.jobs.sync_stocks:main"
tradingai-sync-prices = "tradingai.data.jobs.sync_daily_prices:main"
tradingai-sync-news = "tradingai.data.jobs.sync_news_events:main"
tradingai-sync-regime = "tradingai.data.jobs.sync_regime:main"
tradingai-sync-ticker-kg = "tradingai.data.jobs.sync_ticker_kg:main"
tradingai-propose-ticker-kg = "tradingai.data.jobs.propose_ticker_kg:main"
tradingai-apply-ticker-kg = "tradingai.data.jobs.apply_ticker_kg:main"
tradingai-train-models = "tradingai.analysis.ml.training:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradingai"]

[tool.hatch.build.targets.wheel.force-include]
"src/tradingai/data/universe/us_equities_1000.txt" = "tradingai/data/universe/us_equities_1000.txt"
"src/tradingai/data/schema.sql" = "tradingai/data/schema.sql"
"src/tradingai/sim/dip_sim.toml" = "tradingai/sim/dip_sim.toml"
"src/tradingai/sim/schema.sql" = "tradingai/sim/schema.sql"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests that require network access",
]
