# Open-dip simulator parameters (not loaded from .env).
# Override path via tradingai-run-dip-sim --config /path/to/file.toml

[database]
url = "postgresql://localhost:5432/tradingai_sim"

[download]
days = 60
pace_seconds = 0.25

[strategy]
dip_pct = 4.9
window_minutes = 30
require_status = ["reclaiming"]
# (1/365)*(7/5) ≈ daily net target on buy notional
target_return = 0.004
stop_loss = 0.01
# Omit sell_trail to use target_return / 2 inside profit-target math
profit_taker_buffer = 0.0
buy_notional_usd = 10000.0
max_positions = 10
start_cash = 100000.0
# Omit min_bounce_score (or leave unset) for no score floor
exclude_first_bar_green = false
use_trail = true
entry_cutoff_hour = 11
entry_cutoff_minute = 0
# Clean shape (fraction of dip depth):
# plunging: close[i]-close[i-1] < budget; reclaiming: close[i-1]-close[i] < budget.
# Trend-direction moves and bar high-low width are not limited.
max_oscillation_of_dip = 0.10

# IBKR-like historical query cost (virtual time in the entry scan; no wall-clock sleep).
# Sustained hist pacing ≈ 60 requests / 10 minutes → ~10s between names.
[ibkr_query]
query_latency_seconds = 0.5
query_pace_seconds = 10.0
# Random walk is processed in batches; analyze/rank after each batch.
scan_batch_size = 20

# PNG charts for each buy attempt (wins, losses, canceled pendings).
[charts]
enabled = true
dir = "data/sim_charts"
